# Default Configuration for MWE Assistant
# You can override these values either by modifying this file or via CLI arguments.

audio: 
  - "./audios"

mode: cpu
stt-engine: vosk
tts-engine: piper

out-dir: outputs
keep-normalized: false
input-mode: file  # 'file' or 'mic'

# Aggregate the run's own latency log when it finishes, into the same folder:
# log_averages_summary.txt, log_averages.tsv and log_averages.json. The CSV is
# the raw material, and what the run measured is the distribution over it.
# false leaves the folder with the CSV alone; aggregate_logs.py produces the
# same three files from it at any later point.
summary: true

# How input files are fed to the STT engine.
#   realtime: simulate a microphone at 1x speed, so STT overlaps with the speech.
#             Required for ttfa and stt_endpoint_delay, which are blank without
#             it: only here does a point inside the audio map to an instant.
#             Input files need enough silence after the last word for the
#             endpointer to fire before the audio runs out -- about 1.1 s at the
#             settings below, and more if vosk-endpoint-silence-ms or
#             audio-chunk-ms is raised.
#             Short of that the run measures a path live input never takes. A
#             warning is printed when there is too little, naming the figure.
#   fast:     read as quickly as possible, for throughput runs and for the
#             per-stage costs, which stay valid without the pacing.
audio-pacing: realtime

# What starts the LLM under file input with realtime pacing.
#   endpoint:    answer as soon as the STT calls the utterance over, which is
#                the only thing a microphone can do. Silence past the endpoint
#                costs nothing, so the trailing-silence upper bound drops away.
#   end-of-file: wait for the whole file. Any silence beyond the endpoint is
#                added to the latency in full.
# Ignored under 'fast' pacing and in mic mode. No effect with Whisper, which
# has no endpointer and finalizes only when the stream ends.
file-realtime-trigger: endpoint
# Chunk length handed to the STT. The endpointer can only fire on a chunk
# boundary, so this costs about 0.4 ms of response time per ms of chunk. Nothing
# else measurably moves with it between 50 and 250 ms -- not accuracy, not how
# often the endpointer fires mid-sentence, not STT CPU.
audio-chunk-ms: 100
playback: false   # Play TTS output on speakers
idle-timeout: 10.0 # Shutdown after N seconds of silence

# STT Options
vosk-model: "./vosk/vosk-model-small-en-us-0.15"

# Silence after the last word before Vosk calls the utterance over. This is the
# largest single component of what a user perceives as the response time, and
# the whole of it is on the critical path.
#
# Too low and the endpointer fires on a breath: the LLM is handed half a
# question, and that generation is discarded when the rest of the words arrive.
# Swept over 833 recordings (see vosk_endpoint_sweep.py), 600 ms is where that
# stops happening -- and waiting longer buys nothing, since the one utterance
# still split at 600 ms is a false start that survives 1500 ms too.
#
# One number puts the same wait in front of every utterance. Three -- written
# 500/600/600, for Kaldi's rules 2, 3 and 4 -- keep the shipped habit of leaving
# early when the words already parse as a finished utterance, which takes 220 ms
# off the fifth of utterances where the decoder is sure, at three times the
# split rate. That trade is left to the operator: a split is audible, the answer
# to the half-sentence having usually started playing before the rest arrives.
#
# 0 leaves the model's own settings alone. Nothing recommends them: both of the
# above are faster and split no more often.
vosk-endpoint-silence-ms: 600
whisper-model: "small"
whisper-device: "cpu"
whisper-compute-type: "int8"

# TTS Options
piper-exe: "./piper/piper.exe"
piper-voice: "./piper/en_US-lessac-medium.onnx"
piper-use-exe: false

coqui-voice: "xtts_v2"
coqui-language: "en"
coqui-speaker: "Daisy Studious"

# Shared LLM Options
ollama-model: "phi3:mini"
ollama-url: "http://localhost:11434/api/generate"

# System prompt variant. Variants live in prompts/ and are identified by filename.
# The prompt actually used is copied to <out-dir>/system_prompt.txt.
system-prompt-file: "./prompts/short-opener.txt"

llm-max-tokens: 150

# Response length varies enough between runs to hide whatever is under test, and
# llm_eval, tts_total and e2e_response_ready all scale with it. Greedy decoding
# removes that variance, so a run repeats exactly.
#
# The seed does nothing at temperature 0 and is left unset rather than set to a
# number that looks load-bearing but is not. Raise the temperature only together
# with a seed, for instance to sample realistic response lengths.
# Note: `null` is YAML for "no value"; writing None would be the string "None".
llm-temperature: 0
llm-seed: null

# Safety-net chunk length for the LLM -> TTS handoff. Chunks are normally cut at
# sentence boundaries; a sentence longer than this is split at a word boundary so
# the TTS does not have to wait for the whole response.
# Lower = lower TTFA, higher = better prosody.
tts-chunk-max-chars: 140
